<!DOCTYPE html>

<html>
    <head>
        <title>CSS Internal</title>

        <style type="text/css">
            h1{
                color: rgb(219, 172, 16);
            }

            p{
                color: blueviolet;
                font-family: Arial, Helvetica, sans-serif;
            }

            b{
                color: rgb(67, 21, 236);
            }

            i{
                background-color: rgb(166, 218, 35);
            }
        </style>
    </head>

    <body>
      <h1>Hello World from CSS</h1>

      <P>
        Ini adalah percobaan pertama kita menggunakan <b>HTML</b> dengan <i>CSS</i>.
      </P>
    </body>
</html>
